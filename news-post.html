<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>News | Emerging Nanoelectronics</title>

  <style>
    :root {
      --blue: #168cff;
      --text: #eaf1f7;
      --muted: #9fB0c0;
      --line: rgba(255,255,255,.12);
      --max: 940px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: #020b14;
      line-height: 1.72;
    }

    a {
      color: var(--blue);
      text-decoration: none;
    }

    .header {
      border-bottom: 1px solid var(--line);
      background: #03111e;
    }

    .header-inner {
      max-width: 1180px;
      margin: auto;
      padding: 22px 28px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      color: #fff;
      font-weight: 800;
    }

    .back {
      font-size: 13px;
      font-weight: 700;
    }

    .article {
      max-width: var(--max);
      margin: auto;
      padding: 65px 28px 90px;
    }

    .date {
      color: var(--blue);
      font-size: 12px;
      font-weight: 800;
    }

    h1 {
      margin: 9px 0 17px;
      font-size: clamp(34px, 5vw, 52px);
      line-height: 1.13;
      letter-spacing: -.035em;
    }

    .summary {
      margin-bottom: 30px;
      color: var(--muted);
      font-size: 18px;
    }

    .cover {
      display: block;
      width: 100%;
      max-height: 560px;
      margin: 30px 0 38px;
      object-fit: contain;
      background: #071522;
      border-radius: 10px;
    }

    .body {
      font-size: 16px;
    }

    .body img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }

    .body h2,
    .body h3 {
      margin-top: 34px;
    }

    .body p {
      margin: 16px 0;
    }

    .body blockquote {
      margin-left: 0;
      padding-left: 18px;
      color: var(--muted);
      border-left: 3px solid var(--blue);
    }

    .error {
      color: var(--muted);
    }
  </style>

  

  <link rel="stylesheet" href="header-brand.css">

  <style id="unified-mobile-nav">
    /* Unified mobile/tablet navigation; desktop navigation is unchanged. */
    .mobile-menu-toggle{
      display:none; appearance:none; border:0; background:transparent;
      color:inherit; font:inherit; cursor:pointer; padding:8px; margin-left:auto; line-height:1;
    }
    .mobile-menu-toggle .bar{
      display:block; width:24px; height:2px; margin:5px 0;
      background:currentColor; border-radius:2px;
    }
    @media (max-width:900px){
      .site-header .nav,.header .header-inner{
        position:relative; display:flex; align-items:center;
        justify-content:space-between; flex-wrap:wrap;
      }
      .mobile-menu-toggle{display:block;}
      .site-header .menu,.header .menu{
        display:none !important; width:100%; flex-direction:column;
        align-items:stretch; gap:0; padding:10px 0 14px;
      }
      .site-header .menu.is-open,.header .menu.is-open{display:flex !important;}
      .site-header .menu a,.header .menu a{
        display:block; width:100%; padding:12px 4px;
        border-bottom:1px solid rgba(255,255,255,.08);
      }
    }
  </style>

</head>

<body>

  <header class="header">
    <div class="header-inner">

      <a
        class="brand brand-logo"
        href="./"
        aria-label="DS Han Lab. Home"
      >
        <img
          src="./Images/Logo/ds-han-lab-logo.png"
          alt="DS Han Lab."
        >
      </a>

      <button class="mobile-menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-main-menu">
  <span class="bar"></span><span class="bar"></span><span class="bar"></span>
</button>
<div class="menu" id="mobile-main-menu">
  <a href="./">HOME</a>
  <a href="research.html">RESEARCH</a>
  <a href="people.html">PEOPLE</a>
  <a href="publications.html">PUBLICATIONS</a>
  <a href="news.html">NEWS</a>
  <a href="mailto:dshan@kist.re.kr">CONTACT</a>
  <a href="#" data-private-route="/wiki">WIKI</a>
</div>

    </div>
  </header>

  <article
    class="article"
    id="article"
  >
    <div class="error">
      Loading news article...
    </div>
  </article>

  <script>
    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function loadArticle() {
      const article =
        document.getElementById("article");

      const params =
        new URLSearchParams(window.location.search);

      const slug =
        params.get("slug");

      if (!slug) {
        article.innerHTML =
          '<div class="error">News article not specified.</div>';
        return;
      }

      try {
        const response =
          await fetch("./data/news.json", {
            cache: "no-store"
          });

        const posts =
          await response.json();

        const post =
          posts.find(item => item.slug === slug);

        if (!post) {
          throw new Error("Article not found");
        }

        document.title =
          `${post.title} | Emerging Nanoelectronics`;

        article.innerHTML = `
          <div class="date">
            ${escapeHtml(post.date)}
          </div>

          <h1>
            ${escapeHtml(post.title)}
          </h1>

          <div class="summary">
            ${escapeHtml(post.summary)}
          </div>

          ${
            post.cover
              ? `
                <img
                  class="cover"
                  src="./${escapeHtml(post.cover)}"
                  alt="${escapeHtml(post.title)}"
                >
              `
              : ""
          }

          <div class="body">
            ${post.body_html}
          </div>
        `;
      }
      catch (error) {
        article.innerHTML =
          '<div class="error">This news article could not be loaded.</div>';
      }
    }

    loadArticle();
  </script>

  
<script id="unified-mobile-nav-script">
(function(){
  const toggle=document.querySelector('.mobile-menu-toggle');
  const menu=document.querySelector('.site-header .menu, .header .menu');
  if(!toggle||!menu)return;
  toggle.addEventListener('click',function(){
    const open=menu.classList.toggle('is-open');
    toggle.setAttribute('aria-expanded',open?'true':'false');
    toggle.setAttribute('aria-label',open?'Close menu':'Open menu');
  });
  menu.querySelectorAll('a').forEach(function(link){
    link.addEventListener('click',function(){
      if(window.innerWidth<=900){
        menu.classList.remove('is-open');
        toggle.setAttribute('aria-expanded','false');
        toggle.setAttribute('aria-label','Open menu');
      }
    });
  });
  window.addEventListener('resize',function(){
    if(window.innerWidth>900){
      menu.classList.remove('is-open');
      toggle.setAttribute('aria-expanded','false');
      toggle.setAttribute('aria-label','Open menu');
    }
  });
})();
</script>

  <script src="./private-app-config.js"></script>
</body>
</html>
